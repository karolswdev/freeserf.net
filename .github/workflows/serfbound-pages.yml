# Serfbound public release: build the static artifact and publish it to
# GitHub Pages. Versioned releases come from tags (serfbound-v*); the
# original-data boundary holds — only the app shell is ever published.
name: serfbound-pages

on:
  push:
    tags:
      - "serfbound-v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: serfbound-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serfbound/package-lock.json
      - name: Install
        working-directory: serfbound
        run: npm ci
      - name: Data-free release gates
        working-directory: serfbound
        run: npm test && npm run check:boundaries && npm run test:release:static && npm run test:docs
      - name: Build release artifact
        working-directory: serfbound
        run: npm run build:web
      - name: Stamp version
        working-directory: serfbound
        run: |
          echo "{\"version\": \"${GITHUB_REF_NAME:-dev}\", \"commit\": \"${GITHUB_SHA}\"}" > dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: serfbound/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
